version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: schedulai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-schedulai}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - schedulai-network

  redis:
    image: redis:7.2-alpine
    container_name: schedulai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - schedulai-network

  scheduler:
    build:
      context: ./services/scheduler
      dockerfile: Dockerfile
    container_name: schedulai-scheduler
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - schedulai-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: schedulai-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/schedulai?authSource=admin
      - SCHEDULER_URL=http://scheduler:8000
      - JWT_SECRET=production_jwt_secret_must_be_overridden_in_env_min32chars
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_SECRET=production_refresh_secret_must_be_overridden_in_env_min32chars
      - JWT_REFRESH_EXPIRES_IN=30d
      - CORS_ORIGIN=*
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - schedulai-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: schedulai-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - schedulai-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  schedulai-network:
    driver: bridge
